<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Mucheru's Graduation Invitation</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for elegant typography -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Great+Vibes&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'warm-pink': '#FDF1F4',
                        'warm-pink-dark': '#FCE4EC',
                        'gold': '#D4AF37',
                        'gold-dark': '#B8860B',
                    },
                    fontFamily: {
                        'serif': ['"Playfair Display"', 'serif'],
                        'script': ['"Great Vibes"', 'cursive'],
                        'sans': ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #FDF1F4 0%, #FCE4EC 100%);
            margin: 0;
            overflow: hidden; /* Prevent scrollbars from confetti */
        }

        /* Pop-up animation keyframes */
        @keyframes popUp {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .animate-pop-up {
            animation: popUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            /* Start hidden */
            opacity: 0; 
        }

        /* Subtle glow effect for the card */
        .card-glow {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.2), 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to the card */
            z-index: 50;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative font-sans text-gray-800">

    <!-- Canvas for Confetti -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Main Card Container -->
    <main class="relative z-10 w-full max-w-lg mx-auto bg-white/95 backdrop-blur-sm border-2 border-gold rounded-xl p-8 md:p-12 card-glow animate-pop-up text-center">
        
        <!-- Decorative Top Elements -->
        <div class="flex justify-center mb-6">
            <!-- Academic Cap SVG (Gold) -->
            <svg class="w-16 h-16 text-gold" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3L1 9L5 11.18V17.18L12 21L19 17.18V11.18L21 10.09V17H23V9L12 3ZM18.82 9L12 12.72L5.18 9L12 5.28L18.82 9ZM17 15.99L12 18.72L7 15.99V12.27L12 15L17 12.27V15.99Z"/>
            </svg>
        </div>

        <div class="border-t border-b border-gold/30 py-6 mb-6 relative">
            <!-- Decorative corners -->
            <div class="absolute top-0 left-0 w-3 h-3 border-t-2 border-l-2 border-gold -mt-[2px] -ml-[2px]"></div>
            <div class="absolute top-0 right-0 w-3 h-3 border-t-2 border-r-2 border-gold -mt-[2px] -mr-[2px]"></div>
            
            <!-- Personalized Greeting -->
            <h2 id="guest-greeting" class="font-serif text-2xl md:text-3xl text-gold-dark mb-4 italic">
                Dear Family & Friends,
            </h2>
            
            <p class="text-sm md:text-base leading-relaxed text-gray-700 font-light px-4">
                You are joyfully invited to celebrate the <br>
                <span class="text-gold-dark font-medium">Graduation Ceremony</span> of
            </p>

            <!-- Graduant Name -->
            <h1 class="font-script text-5xl md:text-6xl text-gold mt-6 mb-2 drop-shadow-sm">
                Grace Mucheru
            </h1>
        </div>

        <!-- Event Details -->
        <div class="space-y-4 font-serif tracking-wide text-gray-800">
            <div>
                <p class="text-xs uppercase tracking-widest text-gold mb-1 font-bold">Date</p>
                <p class="text-lg">Wednesday, November 25, 2026</p>
            </div>
            
            <div>
                <p class="text-xs uppercase tracking-widest text-gold mb-1 font-bold">Time</p>
                <p class="text-lg">7:30 AM Prompt</p>
            </div>

            <div>
                <p class="text-xs uppercase tracking-widest text-gold mb-1 font-bold">Venue</p>
                <p class="text-lg">Technical University of Mombasa Main campus</p>
                <p class="text-sm text-gray-500 mt-1 font-sans">Mombasa, Kenya</p>
            </div>
        </div>

        <!-- Decorative Bottom Elements -->
        <div class="mt-8 border-b border-gold/30 relative">
            <div class="absolute bottom-0 left-0 w-3 h-3 border-b-2 border-l-2 border-gold -mb-[2px] -ml-[2px]"></div>
            <div class="absolute bottom-0 right-0 w-3 h-3 border-b-2 border-r-2 border-gold -mb-[2px] -mr-[2px]"></div>
        </div>
        
        <p class="mt-6 text-sm font-medium text-gray-700 italic">
            I look forward to celebrating this milestone with you
        </p>
    </main>

    <script>
        // --- 1. Personalization Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            // Get URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            let guestName = urlParams.get('name');
            const greetingElement = document.getElementById('guest-greeting');

            if (guestName) {
                // Basic sanitization to prevent XSS if they type weird characters
                guestName = guestName.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                greetingElement.innerHTML = `Dear ${guestName},`;
            }

            // Start confetti animation once DOM is loaded
            initConfetti();
        });

        // --- 2. Confetti Animation Logic ---
        function initConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            
            // Set canvas size to window
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Confetti colors (Gold, White, Light Pink to match theme)
            const colors = ['#D4AF37', '#FFC0CB', '#FFFFFF', '#FFB6C1'];

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height - canvas.height; // Start above screen
                    this.size = Math.random() * 8 + 4;
                    this.speed = Math.random() * 3 + 1;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.angle = Math.random() * 360;
                    this.spin = Math.random() * 5 - 2.5;
                }
                
                update() {
                    this.y += this.speed;
                    this.angle += this.spin;
                    
                    // Reset if it goes off screen
                    if (this.y > canvas.height) {
                        this.y = -10;
                        this.x = Math.random() * canvas.width;
                    }
                }
                
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate((this.angle * Math.PI) / 180);
                    ctx.fillStyle = this.color;
                    // Draw a little rectangle (confetti piece)
                    ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.6);
                    ctx.restore();
                }
            }

            // Create particles
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle());
            }

            // Animation loop
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }
                requestAnimationFrame(animate);
            }
            
            animate();
        }
    </script>
</body>
</html>
